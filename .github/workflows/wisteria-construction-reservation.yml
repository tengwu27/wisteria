name: Wisteria Construction Reservation

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled, closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: wisteria-construction-reservations
  cancel-in-progress: false

jobs:
  reserve:
    name: Validate room reservation
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted default-branch workflow code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Reconcile open construction reservations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/github/wisteria-reservation.mjs
