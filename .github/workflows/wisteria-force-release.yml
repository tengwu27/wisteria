name: Wisteria Force Release

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Open construction PR number
        required: true
        type: number
      reason:
        description: Why this stale reservation must be released
        required: true
        type: string
      confirmation:
        description: Type RELEASE to confirm
        required: true
        type: string

permissions:
  issues: write
  pull-requests: read

jobs:
  release:
    name: Explicitly release stale reservation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WISTERIA_PULL_NUMBER: ${{ inputs.pull_request }}
          WISTERIA_FORCE_RELEASE_REASON: ${{ inputs.reason }}
          WISTERIA_FORCE_RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/github/wisteria-force-release.mjs
